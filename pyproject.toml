[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "socket-chatapp"
version = "0.1.0"
description = "A small threaded TCP chat server and terminal client."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jake Takahashi" }]
dependencies = ["prompt-toolkit>=3.0,<4"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
chatapp-server = "chatapp.server:main"
chatapp-client = "chatapp.client:main"

[tool.setuptools.packages.find]
include = ["chatapp*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=chatapp --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
