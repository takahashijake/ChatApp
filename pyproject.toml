[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "socket-chatapp"
version = "0.2.0"
description = "A real-time TCP chat application with terminal and browser clients."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jake Takahashi" }]
dependencies = [
  "fastapi>=0.115,<1",
  "prompt-toolkit>=3.0,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
chatapp-app = "chatapp.app:main"
chatapp-server = "chatapp.server:main"
chatapp-client = "chatapp.client:main"
chatapp-web = "chatapp.web:main"

[tool.setuptools.packages.find]
include = ["chatapp*"]

[tool.setuptools.package-data]
chatapp = [
  "frontend/*.css",
  "frontend/*.html",
  "frontend/*.js",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=chatapp --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
